name: build-exe

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "app.py"
      - "report_engine.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar .exe
        run: >
          pyinstaller --onefile --noconsole --name "RelatorioOS60"
          --collect-all python_calamine
          app.py

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: RelatorioOS60-windows
          path: dist/RelatorioOS60.exe
          if-no-files-found: error

      - name: Criar release com o .exe
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "RelatorioOS60 — build ${{ github.run_number }}"
          files: dist/RelatorioOS60.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
